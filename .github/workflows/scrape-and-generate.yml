name: Scrape, Generate and Deploy Comics RSS

on:
  schedule:
    # Run every 6 hours at 15 minutes past the hour
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch: # Allow manual triggers

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-generate-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci --prefix _generator
        
      - name: Run scraper and generator
        run: node _generator/bin --scrape --generate --verbose
        
      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
      - name: Commit updated cache files only
        run: |
          git add _generator/tmp/
          git commit -m "Update scraped data cache" || echo "No cache changes detected"
          
      - name: Push cache updates
        run: git push origin gh-pages || echo "No changes to push"
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (generated files are now present)
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4