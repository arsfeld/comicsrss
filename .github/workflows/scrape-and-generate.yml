name: Scrape, Generate and Deploy Comics RSS

on:
  schedule:
    # Run every 6 hours at 15 minutes past the hour
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch: # Allow manual triggers
  # Removed push trigger - use deploy-only.yml for push deployments

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-generate-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci --prefix _generator
        
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        
      - name: Restore scraper cache
        uses: actions/cache/restore@v4
        with:
          path: _generator/tmp/
          key: scraper-cache-${{ steps.date.outputs.date }}-${{ github.run_number }}
          restore-keys: |
            scraper-cache-${{ steps.date.outputs.date }}-
            scraper-cache-
            
      - name: Run scraper and generator
        id: scraper
        run: |
          # Run scraper and capture output
          OUTPUT=$(node _generator/bin --scrape --generate --verbose 2>&1)
          echo "$OUTPUT"
          
          # Extract summary JSON if present
          SUMMARY=$(echo "$OUTPUT" | grep "::GITHUB_ACTIONS_SUMMARY::" | sed 's/::GITHUB_ACTIONS_SUMMARY:://')
          if [ ! -z "$SUMMARY" ]; then
            echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          fi
        
      - name: Generate job summary
        if: steps.scraper.outputs.summary
        uses: actions/github-script@v7
        with:
          script: |
            const summary = JSON.parse('${{ steps.scraper.outputs.summary }}');
            
            let markdown = '## 📊 Comics RSS Scraping Summary\n\n';
            
            // Overall stats
            markdown += '### 📈 Overall Statistics\n\n';
            markdown += '| Metric | Value |\n';
            markdown += '|--------|-------|\n';
            markdown += `| ⏱️ Total Time | ${summary.totalTime}s |\n`;
            markdown += `| 🔍 Scrapers Run | ${summary.scrapers.successful}/${summary.scrapers.total} |\n`;
            markdown += `| 📚 Total Comics | ${summary.comics.total} |\n`;
            markdown += `| 🆕 New Strips | ${summary.comics.newStrips} |\n`;
            if (summary.scrapers.failed > 0) {
              markdown += `| ❌ Failed Scrapers | ${summary.scrapers.failed} |\n`;
            }
            markdown += '\n';
            
            // Per-scraper details
            if (summary.details && summary.details.length > 0) {
              markdown += '### 🔍 Scraper Details\n\n';
              markdown += '| Scraper | Comics | New Strips | Time |\n';
              markdown += '|---------|--------|-----------|------|\n';
              summary.details.forEach(scraper => {
                markdown += `| ${scraper.scraperName} | ${scraper.comicCount} | ${scraper.newStrips} | ${scraper.timeTaken}s |\n`;
              });
              markdown += '\n';
            }
            
            // Errors if any
            if (summary.errors && summary.errors.length > 0) {
              markdown += '### ❌ Errors\n\n';
              summary.errors.forEach(error => {
                markdown += `- ${error}\n`;
              });
              markdown += '\n';
            }
            
            // Success message
            if (summary.comics.newStrips > 0) {
              markdown += `\n✨ Successfully scraped **${summary.comics.newStrips}** new comic strips!\n`;
            } else {
              markdown += '\n✅ All comics are up to date!\n';
            }
            
            await core.summary.addRaw(markdown).write();
        
      - name: Save scraper cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: _generator/tmp/
          key: scraper-cache-${{ steps.date.outputs.date }}-${{ github.run_number }}
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (generated files are now present)
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4