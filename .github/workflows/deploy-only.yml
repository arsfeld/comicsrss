name: Deploy to GitHub Pages

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch: # Allow manual triggers

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci --prefix _generator
        
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        
      - name: Restore scraper cache
        uses: actions/cache/restore@v4
        with:
          path: _generator/tmp/
          key: scraper-cache-${{ steps.date.outputs.date }}-${{ github.run_number }}
          restore-keys: |
            scraper-cache-${{ steps.date.outputs.date }}-
            scraper-cache-
            
      - name: Generate site from cached data
        run: node _generator/bin --generate --verbose
        
      - name: Save scraper cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: _generator/tmp/
          key: scraper-cache-${{ steps.date.outputs.date }}-${{ github.run_number }}
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (generated files are now present)
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4